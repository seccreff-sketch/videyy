        * {

        :root {

            --card: #181a1f;
            --card-hover: #1e2127;
            --border: #292d35;
            --text: #f1f3f5;

            --accent: #8b9cff;

        body {

                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;

            background:
                radial-gradient(
                    circle at top,
                    #202431 0%,
                    #101114 45%,
                    #0c0d0f 100%
                );

            color: var(--text);
            min-height: 100vh;
            padding: 35px 16px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            margin: auto;
        }

        /* HEADER */

        .header {
            text-align: center;
            margin-bottom: 28px;
        }

        .logo {
            width: 52px;
            height: 52px;
            margin: 0 auto 15px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 16px;
            background: #20232b;
            border: 1px solid #303541;

            font-size: 22px;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 7px;
        }

        .header p {
            color: var(--muted);
            font-size: 14px;
        }

        /* LINK LIST */

        .link-list {
            display: flex;
            flex-direction: column;
            gap: 11px;
        }

        .link-item {
            position: relative;

            display: flex;
            align-items: center;

            min-height: 62px;
            padding: 14px 17px;

            background: rgba(24, 26, 31, 0.94);

            border: 1px solid var(--border);
            border-radius: 14px;

            color: var(--text);
            text-decoration: none;

            cursor: pointer;

            /* Animasi halus */
            transition:
                transform 0.12s ease,
                background 0.18s ease,
                border-color 0.18s ease,
                box-shadow 0.18s ease;
        }

        /* Saat disentuh / hover */
        .link-item:hover {
            transform: translateY(-2px);
            background: var(--card-hover);
            border-color: #3a4050;

            box-shadow:
                0 7px 20px rgba(0, 0, 0, 0.18);
        }

        /* Efek CLICKY */
        .link-item:active {
            transform: scale(0.94);
            background: #22252c;
            transition: transform 0.06s ease;
        }

        /* Efek ripple */

        .link-item::after {
            content: "";
            position: absolute;

            left: 50%;
            top: 50%;

            width: 10px;
            height: 10px;

            background: rgba(139, 156, 255, 0.18);

            border-radius: 50%;

            transform: translate(-50%, -50%) scale(0);

            opacity: 0;
            pointer-events: none;
        }

        .link-item:active::after {
            animation: ripple 0.45s ease-out;
        }

        @keyframes ripple {
            0% {
                transform: translate(-50%, -50%) scale(0);
                opacity: 0.5;
            }

            100% {
                transform: translate(-50%, -50%) scale(28);
                opacity: 0;
            }
        }

        .number {
            width: 34px;
            height: 34px;

            flex-shrink: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            margin-right: 13px;

            border-radius: 10px;

            background: #22252c;
            color: #aeb5c2;

            font-size: 12px;
            font-weight: 700;
        }

        .link-text {
            flex: 1;

            font-size: 15px;
            font-weight: 500;
            line-height: 1.4;
        }

        .arrow {
            margin-left: 10px;

            color: #686f7b;
            font-size: 20px;

            transition:
                transform 0.18s ease,
                color 0.18s ease;
        }

        .link-item:hover .arrow {
            transform: translateX(4px);
            color: var(--accent);
        }

        /* BANNER */

        .ad-banner-container {
            width: 100%;

            display: flex;
            justify-content: center;
            align-items: center;

            margin: 20px 0;
        }

        .ad-banner-300x250 {
            width: 300px;
            height: 250px;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;

            border-radius: 12px;

            background: #15171b;
            border: 1px solid #292d35;
        }

        /* FOOTER */

        .footer {
            text-align: center;
            margin-top: 28px;

            color: #626873;
            font-size: 12px;
        }

        /* MOBILE */

        @media (max-width: 480px) {

            body {
                padding: 25px 13px;
            }

            .header h1 {
                font-size: 22px;
            }

            .link-item {
                min-height: 59px;
                padding: 13px 14px;
            }

            .link-text {
                font-size: 14px;
            }

            .number {
                width: 32px;
                height: 32px;
                margin-right: 11px;
            }
        }
    </style>
