<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Inter, Arial, sans-serif;
    min-height: 100vh;
    background:
        radial-gradient(circle at top left, #dbeafe 0%, transparent 35%),
        radial-gradient(circle at bottom right, #ede9fe 0%, transparent 35%),
        #f8fafc;
    color: #111827;
}

/* HEADER */
.header {
    text-align: center;
    padding: 42px 20px 25px;
}

.logo {
    display: inline-flex;
    align-items: center;
    justify-content: center;

    width: 48px;
    height: 48px;
    margin-bottom: 15px;

    border-radius: 15px;

    background: linear-gradient(135deg, #111827, #4b5563);
    color: white;

    font-size: 21px;

    box-shadow: 0 8px 25px rgba(17,24,39,.18);
}

.header h1 {
    font-size: 28px;
    font-weight: 750;
    letter-spacing: -0.5px;
}

.header p {
    margin-top: 8px;
    color: #6b7280;
    font-size: 14px;
}

/* CONTAINER */
.container {
    width: 100%;
    max-width: 620px;
    margin: 10px auto 30px;
    padding: 0 15px;
}

/* CARD */
.video {
    position: relative;

    display: flex;
    align-items: center;

    gap: 14px;

    margin-bottom: 13px;
    padding: 17px;

    text-decoration: none;
    color: #111827;

    background: rgba(255,255,255,.88);

    border: 1px solid rgba(255,255,255,.9);
    border-radius: 17px;

    box-shadow:
        0 5px 20px rgba(15,23,42,.06);

    backdrop-filter: blur(8px);

    transition:
        transform .2s ease,
        box-shadow .2s ease,
        border-color .2s ease;
}

.video:hover {
    transform: translateY(-3px);

    box-shadow:
        0 12px 28px rgba(15,23,42,.11);

    border-color: #dbeafe;
}

.video:active {
    transform: scale(.985);
}

/* NUMBER */
.number {
    display: flex;
    align-items: center;
    justify-content: center;

    flex-shrink: 0;

    width: 46px;
    height: 46px;

    border-radius: 13px;

    background: linear-gradient(135deg, #eef2ff, #f5f3ff);

    color: #4f46e5;

    font-size: 13px;
    font-weight: 800;
}

/* TEXT */
.content {
    flex: 1;
    min-width: 0;
}

.label {
    font-size: 10px;
    font-weight: 700;

    color: #8b5cf6;

    text-transform: uppercase;
    letter-spacing: .8px;

    margin-bottom: 5px;
}

.title {
    font-size: 15px;
    font-weight: 650;

    line-height: 1.45;

    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;

    overflow: hidden;
}

/* ARROW */
.arrow {
    flex-shrink: 0;

    width: 30px;
    height: 30px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 50%;

    background: #f3f4f6;

    color: #6b7280;

    font-size: 19px;

    transition: .2s;
}

.video:hover .arrow {
    background: #111827;
    color: white;
}

/* AD CONTAINER */
.ad-slot {
    display: flex;
    justify-content: center;
    align-items: center;

    width: 100%;
    min-height: 250px;

    margin-bottom: 13px;
    padding: 10px;

    background: rgba(255, 255, 255, 0.5);
    border-radius: 17px;
    border: 1px dashed #cbd5e1;
}

/* FOOTER */
.footer {
    text-align: center;

    padding: 5px 20px 30px;

    font-size: 11px;
    color: #9ca3af;
}

/* MOBILE */
@media (max-width: 480px) {

    .header {
        padding-top: 32px;
    }

    .header h1 {
        font-size: 24px;
    }

    .video {
        padding: 14px;
        border-radius: 15px;
    }

        width: 43px;
        height: 43px;
    }

    .title {
        font-size: 14px;
    }

    .arrow {
        width: 28px;
        height: 28px;
    }
}
</style>
